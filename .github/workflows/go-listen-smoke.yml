name: go_listen_events smoke test

# Runs on any PR that touches migrations or the canonical event list.
# If the smoke test fails, the PR fails — prevents CHECK/RLS drift from shipping.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   NEXT_PUBLIC_SUPABASE_URL         — https://xxx.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY    — project anon key (public)
#   SUPABASE_SERVICE_ROLE_KEY        — project service role key (for cleanup)
#   SUPABASE_MANAGEMENT_TOKEN        — sbp_xxx personal access token (for pg_policies diff)
#
# The test inserts probe rows via the anon key and deletes them via the service
# role. All rows use a fixed synthetic session_id and are cleaned up before and
# after the run, so production data is not affected.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'lib/goListenEventList.ts'

jobs:
  smoke-go-listen:
    name: go_listen_events RLS + event smoke test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run go_listen_events smoke test
        run: node scripts/smoke-go-listen-migration.js

      # If the smoke test fails, this step explains what to do.
      - name: Failure guidance
        if: failure()
        run: |
          echo ""
          echo "══════════════════════════════════════════════════════"
          echo "SMOKE TEST FAILED — do not merge this PR."
          echo ""
          echo "Likely cause: a migration updated the event CHECK"
          echo "constraint but did not update the RLS INSERT policy."
          echo ""
          echo "Fix: add a DROP + CREATE POLICY block to the migration"
          echo "file. See supabase/migrations/README.md for the pattern."
          echo "══════════════════════════════════════════════════════"
